[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "py-aerograph"
version = "0.1.0"
description = "Massively parallel sim-to-real physics engine for PyTorch/Jax RL training"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "gymnasium>=0.29",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "py_aerograph.py_aerograph"
