[workspace]
resolver = "2"
members = [
    "crates/aerograph-core",
    "crates/aerograph-gui",
    "crates/py-aerograph",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AeroGraph Project"]
homepage = "https://aerograph.io"

[workspace.dependencies]
aerograph-core = { path = "crates/aerograph-core" }
glam = { version = "0.28", features = ["rayon", "bytemuck"] }
rayon = "1.10"
crossbeam-queue = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
wgpu = "0.20"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
egui = "0.27"
eframe = { version = "0.27", features = ["wgpu"] }
egui_node_graph = "0.4"
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
numpy = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
